<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supercurricular Planner — PPE &amp; Law</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F5;
    --surface:#FFFFFF;
    --surface-2:#FBFBF9;
    --ink:#14161A;
    --ink-2:#3D434D;
    --muted:#6B7280;
    --faint:#9CA3AF;
    --line:#E5E5E1;
    --line-2:#EFEFEC;
    --accent:#B45309;
    --phil:#7C3AED;
    --pol:#DC2626;
    --econ:#059669;
    --law:#2563EB;
    --multi:#D97706;
    --ok-bg:#ECFDF5; --ok-fg:#065F46; --ok-line:#A7F3D0;
    --wait-bg:#F4F4F5; --wait-fg:#52525B; --wait-line:#E4E4E7;
    --warn-bg:#FEF3C7; --warn-fg:#92400E; --warn-line:#FDE68A;
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 6px 16px -8px rgba(16,18,22,.10);
    --shadow-lg:0 2px 4px rgba(16,18,22,.05), 0 18px 40px -20px rgba(16,18,22,.22);
    --radius:12px;
    --tab-well:#EFEFEC;
    --tab-sel:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0D0F12;
      --surface:#15181D;
      --surface-2:#1A1E24;
      --ink:#ECEEF1;
      --ink-2:#C3C9D2;
      --muted:#98A0AC;
      --faint:#6B7280;
      --line:#262B33;
      --line-2:#1F242B;
      --accent:#F59E0B;
      --phil:#A78BFA;
      --pol:#F87171;
      --econ:#34D399;
      --law:#60A5FA;
      --multi:#FBBF24;
      --ok-bg:#052E22; --ok-fg:#6EE7B7; --ok-line:#065F46;
      --wait-bg:#1C1F25; --wait-fg:#9CA3AF; --wait-line:#2A2F37;
      --warn-bg:#3B2A08; --warn-fg:#FCD34D; --warn-line:#5A4210;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -8px rgba(0,0,0,.6);
      --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 18px 40px -20px rgba(0,0,0,.8);
      --tab-well:#080A0D;
      --tab-sel:#232830;
    }
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 96px;}
  .wrap.top{padding-bottom:0;}

  /* ---------- header ---------- */
  header.hero{
    padding:56px 0 28px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:clamp(30px,4.4vw,46px);
    letter-spacing:-.02em;
    line-height:1.08;
    margin:0 0 12px;
  }
  .sub{color:var(--muted);font-size:16px;max-width:60ch;margin:0;}
  .stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:26px;}
  .stat b{
    display:block;font-family:'Fraunces',Georgia,serif;font-size:26px;font-weight:600;
    letter-spacing:-.02em;line-height:1;
  }
  .stat span{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;font-weight:500;}

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;top:0;z-index:40;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:saturate(180%) blur(12px);
    -webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    margin-bottom:32px;
  }
  .toolbar-inner{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

  .yeartabs{display:flex;gap:4px;background:var(--tab-well);border:1px solid var(--line);border-radius:10px;padding:4px;}
  .yeartab{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13px;font-weight:600;color:var(--muted);
    padding:7px 14px;border-radius:7px;white-space:nowrap;transition:.15s;
  }
  .yeartab small{display:block;font-size:10.5px;font-weight:500;opacity:.75;letter-spacing:.02em;}
  .yeartab:hover{color:var(--ink);}
  .yeartab[aria-selected="true"]{background:var(--tab-sel);color:var(--ink);box-shadow:var(--shadow);}

  .pill{
    appearance:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:500;
    padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);transition:.15s;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .pill:hover{color:var(--ink);border-color:var(--faint);}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;}
  .pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .pill[aria-pressed="true"] .dot{background:var(--bg);}
  .pill.phil{color:var(--phil);} .pill.pol{color:var(--pol);}
  .pill.econ{color:var(--econ);} .pill.law{color:var(--law);} .pill.multi{color:var(--multi);}

  .search{
    flex:1;min-width:180px;
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:6px 14px;
  }
  .search input{
    flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);min-width:0;
  }
  .search input::placeholder{color:var(--faint);}
  .search svg{flex:none;color:var(--faint);}

  .toggle{
    appearance:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:500;
    padding:6px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);transition:.15s;white-space:nowrap;
  }
  .toggle[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-line);}
  .count{font-size:12px;color:var(--faint);margin-left:auto;white-space:nowrap;}

  /* ---------- caveat ---------- */
  .caveat{
    display:flex;gap:12px;
    background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);
    padding:13px 16px;border-radius:var(--radius);font-size:13px;line-height:1.5;margin-bottom:34px;
  }
  .caveat svg{flex:none;margin-top:2px;}

  /* ---------- month ---------- */
  .month{margin-bottom:38px;}
  .month-head{
    display:flex;align-items:baseline;gap:12px;
    margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line);
  }
  .month-head h2{
    font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;
    letter-spacing:-.01em;margin:0;
  }
  .month-head .n{font-size:11.5px;color:var(--faint);font-weight:500;}

  /* ---------- card ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px 15px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc,var(--multi));
  }
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:var(--faint);}
  .card.phil{--sc:var(--phil);} .card.pol{--sc:var(--pol);}
  .card.econ{--sc:var(--econ);} .card.law{--sc:var(--law);} .card.multi{--sc:var(--multi);}

  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px;}
  .chip{
    font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    padding:3px 8px;border-radius:5px;white-space:nowrap;
    border:1px solid transparent;
  }
  .chip.subj{color:var(--sc);background:color-mix(in srgb, var(--sc) 11%, transparent);border-color:color-mix(in srgb, var(--sc) 26%, transparent);}
  .chip.new{background:var(--accent);color:#fff;}
  @media (prefers-color-scheme: dark){ .chip.new{color:#1A1206;} }
  .chip.yr{background:var(--wait-bg);color:var(--wait-fg);border-color:var(--wait-line);text-transform:none;letter-spacing:0;font-weight:500;}
  .chip.elig-now{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-line);}
  .chip.elig-later{background:var(--wait-bg);color:var(--wait-fg);border-color:var(--wait-line);}
  .chip.tbc{background:transparent;color:var(--faint);border-color:var(--line);text-transform:none;letter-spacing:0;font-weight:500;font-style:italic;}

  .card h3{
    font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:17px;
    letter-spacing:-.01em;margin:0 0 5px;line-height:1.25;
  }
  .when{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;color:var(--ink-2);
    font-variant-numeric:tabular-nums;margin-bottom:7px;
  }
  .when svg{color:var(--faint);flex:none;}
  .note{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0 0 11px;}
  .note em{color:var(--accent);font-style:normal;font-weight:600;}

  /* ---------- reading ---------- */
  .reading{
    background:var(--surface-2);
    border:1px solid var(--line-2);
    border-radius:9px;
    padding:11px 13px;
    margin-bottom:11px;
  }
  .reading-h{
    font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--faint);margin-bottom:9px;
  }
  .book{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:start;margin-bottom:8px;font-size:13px;line-height:1.5;}
  .book:last-of-type{margin-bottom:0;}
  .book .lbl{
    font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    padding:3px 0 0;color:var(--faint);
  }
  .book.m .lbl{color:var(--econ);}
  .book.n .lbl{color:var(--phil);}
  .book .txt{color:var(--ink-2);}
  .book .txt b{color:var(--ink);font-weight:600;}
  .book .txt i{font-style:italic;}
  .book .txt .why{display:block;color:var(--muted);font-size:12.5px;margin-top:1px;}
  .thelink{
    margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);
    font-size:12.5px;color:var(--muted);line-height:1.5;
  }
  .thelink b{color:var(--ink-2);font-weight:600;}

  .src{font-size:12.5px;}
  .src a{
    color:var(--muted);text-decoration:none;font-weight:500;
    border-bottom:1px solid var(--line);padding-bottom:1px;transition:.15s;
  }
  .src a:hover{color:var(--accent);border-color:var(--accent);}
  .src .nolink{color:var(--faint);font-style:italic;}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}
  .empty b{display:block;font-family:'Fraunces',Georgia,serif;font-size:19px;color:var(--ink);margin-bottom:6px;font-weight:600;}

  footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);line-height:1.6;}
  footer b{color:var(--ink-2);}

  @media (max-width:640px){
    .wrap{padding:0 14px 70px;}
    header.hero{padding:36px 0 22px;}
    .stats{gap:18px;}
    .book{grid-template-columns:1fr;gap:2px;}
    .book .lbl{padding:0;}
    .count{margin-left:0;width:100%;}
  }
</style>
</head>
<body>

<div class="wrap top">
  <header class="hero">
    <div class="eyebrow">Plan: Oxbridge — companion planner</div>
    <h1>Supercurricular Planner</h1>
    <p class="sub">Philosophy · Politics · Economics · Law — every competition, programme and prize sorted into the school year it actually applies to, each paired with one mainstream and one niche book.</p>
    <div class="stats">
      <div class="stat"><b id="s-total">—</b><span>opportunities</span></div>
      <div class="stat"><b id="s-now">—</b><span>you can enter now</span></div>
      <div class="stat"><b id="s-new">—</b><span>added this pass</span></div>
    </div>
  </header>
</div>

<div class="toolbar">
  <div class="toolbar-inner">
    <div class="row">
      <div class="yeartabs" id="yeartabs" role="tablist"></div>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search competitions, books, authors…" autocomplete="off">
      </div>
    </div>
    <div class="row" id="filters"></div>
  </div>
</div>

<div class="wrap">
  <div class="caveat" id="caveat"></div>
  <main id="content"></main>
  <footer id="foot"></footer>
</div>

<script>
/* ============================================================
   DATA
   s   : phil | pol | econ | law | multi
   elig: "now"   — you can enter this as a Year 11
         "later" — Y12+ only, listed so the timing doesn't surprise you
         "check" — eligibility genuinely unconfirmed
   reading: { m: mainstream entry point, n: niche standout, link: how to use the pair }
   ============================================================ */
const CAVEATS = {
  y11:"Year 11 view (Sept 2026 – Aug 2027). Where an organiser has published a 2026 date, that exact date is shown and the 2027 equivalent will land within a week or two of it. Anything marked <b>date TBC</b> is dated from its most recent cycle only — check the official page before you rely on it.",
  y1213:"Year 12/13 view (Sept 2027 onward). Almost nothing has published 2027-28 or 2028-29 dates yet. Every date below is the most recent <i>confirmed</i> cycle, shown as a reliable guide to the month — not a confirmed future date. Re-check each site when you actually reach that year."
};

const DATA = {};

DATA.y11 = [
{ month:"Rolling — start any time this year", items:[

  {t:"Oxford 14–16 Digital Resources", s:"multi", yr:"Ages 14–16", elig:"now",
   when:"Open all year", link:"https://www.ox.ac.uk/admissions/undergraduate/increasing-access/ug-digital-resources/students-12-16",
   note:"Subject-specific resource hub aimed at <em>exactly</em> your age bracket right now — the only Oxford-run thing on this list built for pre-sixth-form students.",
   reading:{
     m:"Simon Blackburn, <i>Think</i>|The standard first philosophy book — on multiple Oxford PPE prep lists.",
     n:"Edmund Gettier, <i>“Is Justified True Belief Knowledge?”</i>|A three-page 1963 paper that broke the definition of knowledge everyone had used since Plato.",
     link:"Blackburn spends a whole chapter building up the classic definition of knowledge. Gettier demolishes it in three pages. Reading the actual paper straight after the textbook is the cheapest depth available to you — and almost no applicant has done it."}},

  {t:"Cambridge: Exploring Law Course", s:"law", yr:"16+ (Y11/12/13)", elig:"now",
   when:"Open all year", link:"https://www.law.cam.ac.uk/access-outreach/exploring-law-course-studying-law-university",
   note:"Short self-paced course introducing legal study. Open to you now — this is not a Y12-only programme.",
   reading:{
     m:"Barnard, O'Sullivan &amp; Virgo, <i>What About Law?</i>|Written by Cambridge law fellows and recommended by Cambridge colleges as pre-arrival reading.",
     n:"H.L.A. Hart, <i>The Concept of Law</i>, ch. 5|The foundational text of modern legal positivism. Read one chapter properly rather than skimming all of it.",
     link:"<i>What About Law?</i> shows you what law students <b>do</b>. Hart asks what law <b>is</b> — his 'union of primary and secondary rules' is the answer. Being able to name that distinction unprompted is a genuine interview differentiator."}},

  {t:"KCL Online Law Lecture Series", s:"law", yr:"Y11–13", elig:"now",
   when:"Termly — check KCL for the current schedule", link:"https://www.kcl.ac.uk/study/social-mobility/projects/prospective-students/online-law-lecture-series",
   note:"Free online lecture series, explicitly open from Y11.",
   reading:{
     m:"Tom Bingham, <i>The Rule of Law</i>|A former Lord Chief Justice setting out eight principles of the rule of law. The most-recommended law book for applicants.",
     n:"A.V. Dicey, <i>Introduction to the Study of the Law of the Constitution</i>|The 1885 Victorian original that gave us 'parliamentary sovereignty' and 'the rule of law' as UK constitutional doctrine.",
     link:"Bingham's eight principles are a deliberate modern restatement of Dicey. Reading the original lets you say precisely <b>where Bingham departs from him</b> — especially on whether the rule of law includes human rights. That is a real argument, not a summary."}},

  {t:"Forage Online Job Simulations", s:"econ", yr:"16+ / Y11+", elig:"now",
   when:"Self-paced, open all year", link:"https://www.theforage.com/",
   note:"Free simulations built with real employers. Low effort, decent signal — but only if you have something to say <em>about</em> the industry afterwards.",
   reading:{
     m:"Nicholas McBride, <i>Letters to a Law Student</i>|The single most-recommended starting point for law applicants; also the best plain-English account of what commercial lawyers actually do.",
     n:"John Kay, <i>Other People's Money</i>|A former Oxford economist's forensic case that most of modern finance serves finance, not the real economy.",
     link:"A Forage sim teaches you the <b>tasks</b>. Kay asks whether the industry performing those tasks is socially useful at all. 'I completed the simulation, then read Kay and started doubting the point of half of it' is a far better answer than listing modules."}},

  {t:"CISI Certifications", s:"econ", yr:"Age not stated — verify", elig:"check",
   when:"Self-paced", link:"https://www.cisi.org/cisiweb2",
   note:"Self-paced finance certifications. Confirm the entry age with CISI directly before paying for anything.",
   reading:{
     m:"Burton Malkiel, <i>A Random Walk Down Wall Street</i>|The classic case for efficient markets and index investing.",
     n:"Walter Bagehot, <i>Lombard Street</i> (1873)|The Victorian text that invented the 'lender of last resort' — still quoted by central bankers today.",
     link:"Malkiel explains why markets are hard to beat; Bagehot explains why we regulate them at all. CISI's syllabus sits precisely between those two, and citing an 1873 book on a finance certification is exactly the kind of thing an interviewer remembers."}},

  {t:"Coursera Courses", s:"econ", yr:"Age not stated — verify", elig:"check",
   when:"Self-paced", link:"https://www.coursera.org/",
   note:"Pick courses tied directly to economics/PPE topics rather than collecting generic certificates. <em>One finished course you can argue about beats five you skimmed.</em>",
   reading:{
     m:"CORE Econ, <i>The Economy</i> (free online)|Literally what Oxford tells PPE offer-holders to read before arriving. Using it <i>before</i> you apply is a strong signal.",
     n:"Ha-Joon Chang, <i>Kicking Away the Ladder</i>|A Cambridge economist arguing, from the historical record, that today's rich countries all used the protectionist policies they now tell poor countries to avoid.",
     link:"CORE is the modern mainstream curriculum. Chang attacks one of its central assumptions using economic history. Doing the course and then reading the strongest available objection to it is the whole game."}},
]},

{ month:"August – September 2026", items:[

  {t:"Wharton Global High School Investment Competition", s:"econ", yr:"Grades 9–12 (UK Y10–13)", elig:"now", tag:"NEW",
   when:"Registration 10 Aug – 11 Sept 2026 · competition runs 28 Sept – 4 Dec 2026",
   link:"https://globalyouth.wharton.upenn.edu/competitions/investment-competition/",
   note:"<em>Team event — you need 4–6 students and a teacher advisor, so raise it with a teacher in September.</em> Top 50 teams reach virtual semi-finals; top 10 go to the Global Finale at Wharton (29–30 April 2027). Crucially, teams are judged on the <em>quality of their investment strategy and report, not their returns.</em>",
   reading:{
     m:"Burton Malkiel, <i>A Random Walk Down Wall Street</i>|The standard argument that stock-picking rarely beats the index — which is awkward and useful for a stock-picking competition.",
     n:"Howard Marks, <i>The Most Important Thing</i>|A working fund manager on 'second-level thinking' and risk control, written for professionals rather than students.",
     link:"You're marked on your Investment Policy Statement, not your P&amp;L. Marks is a book about exactly that discipline — defining risk before you chase return. Almost no competing school team will have read it, and it maps one-to-one onto the judging criteria."}},

  {t:"ESU Schools' Mace — registration", s:"pol", yr:"Ages 11–18 (Y7–13)", elig:"now", tag:"NEW",
   when:"Register with your school Sept/Oct · rounds run to ~April finals",
   link:"https://www.esu.org/competitions/schools-mace/",
   note:"The UK's largest schools debating competition. Strong for Politics <em>and</em> for the Law-style skill of arguing a side you don't hold.",
   reading:{
     m:"J.S. Mill, <i>On Liberty</i>|The harm principle — the single most-invoked idea in school debating, usually by people who haven't read it.",
     n:"Isaiah Berlin, <i>Two Concepts of Liberty</i> (essay)|Splits freedom into 'negative' (absence of interference) and 'positive' (capacity to act).",
     link:"Every debater says 'freedom'. Berlin lets you stop and ask <b>which kind</b> your opponent means — and most motions collapse the moment someone does. It is the highest-leverage 60 pages you can read for this competition."}},

  {t:"JLI Global Essay Prize — registration opens", s:"multi", yr:"Y11 / Y12", elig:"now", tbc:true,
   when:"Registration opens autumn/winter · deadline 31 May 2027",
   link:"https://www.johnlockeinstitute.com/essay-competition",
   note:"Categories include Philosophy, Politics, Economics <em>and</em> Law — your single best PPE-spanning entry point, because you pick whichever category matches your strongest current interest.",
   reading:{
     m:"Jonathan Wolff, <i>An Introduction to Political Philosophy</i>|On Oxford PPE first-year reading lists; teaches you to lay out both sides of a dispute cleanly.",
     n:"G.A. Cohen, <i>Why Not Socialism?</i>|Under 100 pages. An Oxford political philosopher arguing a position most readers begin hostile to — and doing it with a camping-trip thought experiment.",
     link:"JLI questions are deliberately provocative and reward <b>taking a clear side well</b>, not surveying opinions. Cohen is a masterclass in exactly that move, and he's short enough to read twice before you write."}},
]},

{ month:"October – November 2026", items:[

  {t:"Warwick Future Economist Essay Competition", s:"econ", yr:"Ages 16–18", elig:"check", tag:"NEW", tbc:true,
   when:"2025 cycle: opened 6 Oct, closed 7 Nov — expect the same window",
   link:"https://www.warwickeconomicssociety.com/copy-of-careers-talks",

/* ============================================================
   RENDER
   ============================================================ */
const SUBJECTS = [
  {k:"phil",  label:"Philosophy"},
  {k:"pol",   label:"Politics"},
  {k:"econ",  label:"Economics"},
  {k:"law",   label:"Law"},
  {k:"multi", label:"Multi-subject"},
];
const YEARS = [
  {k:"y11",   label:"Year 11",      range:"Sept 2026 – Aug 2027"},
  {k:"y1213", label:"Year 12 / 13", range:"Sept 2027 – Aug 2029"},
];

const state = { year:"y11", subjects:new Set(), eligOnly:false, q:"" };

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
};

const ICON_CAL  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const ICON_WARN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>';

/* "Author, <i>Title</i>|why it earns its place" -> two-part markup */
function bookRow(kind, raw){
  const i = raw.indexOf('|');
  const title = i === -1 ? raw : raw.slice(0, i);
  const why   = i === -1 ? ''  : raw.slice(i + 1);
  const lbl = kind === 'm' ? 'Start here' : 'Stand out';
  return '<div class="book ' + kind + '">'
       +   '<div class="lbl">' + lbl + '</div>'
       +   '<div class="txt"><b>' + title + '</b>'
       +     (why ? '<span class="why">' + why + '</span>' : '')
       +   '</div>'
       + '</div>';
}

function matches(item){
  if(state.subjects.size && !state.subjects.has(item.s)) return false;
  if(state.eligOnly && item.elig !== 'now') return false;
  if(state.q){
    const hay = [
      item.t, item.yr, item.when, item.note,
      item.reading ? item.reading.m + ' ' + item.reading.n + ' ' + item.reading.link : ''
    ].join(' ').replace(/<[^>]*>/g, '').toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function card(item){
  const c = el('div', 'card ' + item.s);

  const meta = el('div', 'meta');
  meta.appendChild(el('span', 'chip subj', SUBJECTS.find(s => s.k === item.s).label));
  if(item.tag) meta.appendChild(el('span', 'chip new', item.tag));
  if(item.elig === 'now')        meta.appendChild(el('span', 'chip elig-now',   'Eligible now'));
  else if(item.elig === 'later') meta.appendChild(el('span', 'chip elig-later', 'Y12+ only'));
  else                           meta.appendChild(el('span', 'chip elig-later', 'Check eligibility'));
  meta.appendChild(el('span', 'chip yr', item.yr));
  if(item.tbc) meta.appendChild(el('span', 'chip tbc', 'date TBC'));
  c.appendChild(meta);

  c.appendChild(el('h3', null, item.t));
  if(item.when) c.appendChild(el('div', 'when', ICON_CAL + '<span>' + item.when + '</span>'));
  if(item.note) c.appendChild(el('p', 'note', item.note));

  if(item.reading){
    const r = el('div', 'reading');
    r.appendChild(el('div', 'reading-h', 'Read alongside this'));
    r.insertAdjacentHTML('beforeend', bookRow('m', item.reading.m));
    r.insertAdjacentHTML('beforeend', bookRow('n', item.reading.n));
    if(item.reading.link){
      r.appendChild(el('div', 'thelink', '<b>The link →</b> ' + item.reading.link));
    }
    c.appendChild(r);
  }

  const src = el('div', 'src');
  if(item.link){
    src.innerHTML = '<a href="' + item.link + '" target="_blank" rel="noopener">Official page ↗</a>';
  } else {
    src.innerHTML = '<span class="nolink">No official page found — verify directly</span>';
  }
  c.appendChild(src);
  return c;
}

function render(){
  const content = $('content');
  content.innerHTML = '';
  $('caveat').innerHTML = ICON_WARN + '<div>' + CAVEATS[state.year] + '</div>';

  let shown = 0;
  DATA[state.year].forEach(group => {
    const items = group.items.filter(matches);
    if(!items.length) return;
    shown += items.length;

    const m = el('div', 'month');
    const head = el('div', 'month-head');
    head.appendChild(el('h2', null, group.month));
    head.appendChild(el('span', 'n', items.length + (items.length === 1 ? ' entry' : ' entries')));
    m.appendChild(head);
    items.forEach(it => m.appendChild(card(it)));
    content.appendChild(m);
  });

  if(!shown){
    content.appendChild(el('div', 'empty',
      '<b>Nothing matches those filters</b>Try clearing the search box or turning off “Eligible now”.'));
  }

  const total = DATA[state.year].reduce((a, g) => a + g.items.length, 0);
  $('count').textContent = shown === total
    ? total + ' shown'
    : shown + ' of ' + total + ' shown';

  updateStats();
}

function updateStats(){
  const all = [].concat(...Object.values(DATA).map(y => [].concat(...y.map(g => g.items))));
  $('s-total').textContent = all.length;
  $('s-now').textContent   = [].concat(...DATA.y11.map(g => g.items)).filter(i => i.elig === 'now').length;
  $('s-new').textContent   = all.filter(i => i.tag === 'NEW').length;
}

function buildControls(){
  const yt = $('yeartabs');
  YEARS.forEach(y => {
    const b = el('button', 'yeartab', y.label + '<small>' + y.range + '</small>');
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', y.k === state.year);
    b.onclick = () => {
      state.year = y.k;
      [...yt.children].forEach(c => c.setAttribute('aria-selected', 'false'));
      b.setAttribute('aria-selected', 'true');
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    yt.appendChild(b);
  });

  const f = $('filters');
  SUBJECTS.forEach(s => {
    const b = el('button', 'pill ' + s.k, '<span class="dot"></span>' + s.label);
    b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      if(state.subjects.has(s.k)) state.subjects.delete(s.k);
      else state.subjects.add(s.k);
      b.setAttribute('aria-pressed', state.subjects.has(s.k));
      render();
    };
    f.appendChild(b);
  });

  const t = el('button', 'toggle', '✓ Eligible now only');
  t.setAttribute('aria-pressed', 'false');
  t.onclick = () => {
    state.eligOnly = !state.eligOnly;
    t.setAttribute('aria-pressed', state.eligOnly);
    render();
  };
  f.appendChild(t);

  const c = el('span', 'count');
  c.id = 'count';
  f.appendChild(c);

  let timer;
  $('q').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); render(); }, 140);
  });
}

$('foot').innerHTML =
  '<b>How to use the reading pairs.</b> Every entry gives you one <b>mainstream</b> book (the accessible way in, usually on an official prep list) and one <b>niche</b> one (the text that makes you memorable). '
+ 'Read the mainstream one first so the niche one lands — then use the tension between them as your personal-statement line: <i>“I read X, which led me to Y, so I argued Z in [competition].”</i> '
+ 'It is the contrast, not the number of books, that reads as real engagement.<br><br>'
+ '<b>Honesty rule.</b> Several niche picks are genuinely hard (Hart, Parfit, Piketty, Friedman &amp; Schwartz). Reading three chapters properly and saying so is stronger than claiming a book you skimmed — interviewers ask follow-ups.<br><br>'
+ 'Dates checked against organisers’ own pages, July 2026. Anything marked <b>date TBC</b> or <b>Check eligibility</b> is not confirmed — verify before you plan around it.';

buildControls();
render();
</script>
</body>
</html>
