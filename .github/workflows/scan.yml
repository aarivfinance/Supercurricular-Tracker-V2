name: Scan for openings and supercurriculars
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/scan.mjs
      - run: node scripts/scan-supers.mjs
      - run: |
          git config user.name "openings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/openings.json data/ats-cache.json data/supercurriculars-live.json
          git diff --cached --quiet || git commit -m "Update live data" && git push
