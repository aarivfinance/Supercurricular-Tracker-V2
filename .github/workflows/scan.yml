name: Scan for openings and supercurriculars
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/scan.mjs
      - run: node scripts/scan-supers.mjs
      - name: Email me new school-age openings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/alert.md ]; then
            gh issue create --title "New openings for you – $(date -u '+%d %b %Y')" --body-file data/alert.md
          fi
      - run: |
          git config user.name "openings-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash
          git add data/openings.json data/ats-cache.json data/supercurriculars-live.json
          git diff --cached --quiet || git commit -m "Update live data" && git push
